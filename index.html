<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kandengthu · Ink Stories</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #002b36;
      color: #839496;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      color: #93a1a1;
      margin-bottom: 0.5rem;
    }
    p {
      color: #839496;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .story-link {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      background: #073642;
      color: #268bd2;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .story-link:hover {
      background: #2aa198;
      color: #002b36;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ink Stories</h1>
    <p>交互式故事 · 沉浸式阅读</p>
    <a class="story-link" href="ued-explore/">UED Explore：学术英语背词洞察</a>
  </main>
</body>
</html>
