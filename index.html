<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kandengthu · Ink Stories</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PT Serif", 'Times New Roman', 'SF Pro', Times, 'Songti SC', 宋体, SimSun, serif;
      background: #f3f2ee;
      color: #1f0909;
      line-height: 1.5em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 40em;
      text-align: center;
    }
    h1 {
      font-size: 1.875em;
      color: #1f0909;
      margin-bottom: 0.5rem;
    }
    p {
      color: #1f0909;
      font-size: 1em;
      line-height: 1.5em;
      margin-bottom: 2rem;
    }
    .story-link {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      background: #e8e7e7;
      color: #065588;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 400;
      transition: background 0.2s;
    }
    .story-link:hover {
      background: #dadada;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ink Stories</h1>
    <p>交互式故事 · 沉浸式阅读</p>
